name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets-leak gate (tracked files only; never touches untracked .env.local)
        run: |
          if git grep -E 'sk-or-v1-[A-Za-z0-9]{10,}|npg_[A-Za-z0-9]{10,}|BEGIN [A-Z ]*PRIVATE KEY' -- . ':!.github/workflows/ci.yml' ':!README.md'; then
            echo 'Possible secret committed to tracked files' >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
